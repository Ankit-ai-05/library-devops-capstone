services:
  db:
    image: postgres:15-alpine
    container_name: library-db
    environment:
      POSTGRES_USER: libuser
      POSTGRES_PASSWORD: libpassword
      POSTGRES_DB: librarydb
    volumes:
      - pgdata:/var/lib/postgresql/data

  web:
    build: .
    container_name: library-web
    ports:
      - "5005:5005"
    environment:
      DATABASE_URL: postgresql+psycopg2://libuser:libpassword@db:5432/librarydb
      SECRET_KEY: capstone-secret
    depends_on:
      - db

volumes:
  pgdata:
