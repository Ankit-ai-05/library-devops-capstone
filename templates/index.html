<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Library Management System - DevOps Capstone</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
  <h2 class="mb-4 text-primary">Library Management System</h2>

  {% if not logged_in %}
  <div class="card shadow-sm" style="max-width: 400px;">
    <div class="card-body">
      <h5 class="card-title mb-3">Admin Login</h5>
      {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
      <form method="POST" action="/login">
        <div class="mb-3"><input type="text" name="username" class="form-control" placeholder="Username (admin)" required></div>
        <div class="mb-3"><input type="password" name="password" class="form-control" placeholder="Password (admin123)" required></div>
        <button class="btn btn-primary w-100">Login</button>
      </form>
    </div>
  </div>
  {% else %}
  <div class="d-flex justify-content-between align-items-center mb-3">
    <span>Welcome, <strong>{{ user }}</strong></span>
    <a href="/logout" class="btn btn-outline-danger btn-sm">Logout</a>
  </div>

  <form method="POST" action="/add" class="row g-2 mb-4">
    <div class="col-md-5"><input type="text" name="title" class="form-control" placeholder="Book Title" required></div>
    <div class="col-md-5"><input type="text" name="author" class="form-control" placeholder="Author Name" required></div>
    <div class="col-md-2"><button class="btn btn-success w-100">Add Book</button></div>
  </form>

  <table class="table table-bordered bg-white shadow-sm">
    <thead class="table-dark"><tr><th>ID</th><th>Title</th><th>Author</th><th>Status</th><th>Actions</th></tr></thead>
    <tbody>
      {% for b in books %}
      <tr>
        <td>{{ b.id }}</td><td>{{ b.title }}</td><td>{{ b.author }}</td>
        <td><span class="badge {{ 'bg-success' if b.status == 'Available' else 'bg-warning text-dark' }}">{{ b.status }}</span></td>
        <td>
          <a href="/toggle/{{ b.id }}" class="btn btn-sm btn-info text-white">Toggle Status</a>
          <a href="/delete/{{ b.id }}" class="btn btn-sm btn-danger">Delete</a>
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
  {% endif %}
</div>
</body>
</html>
