apiVersion: apps/v1
kind: Deployment
metadata:
  name: library-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: library-web
  template:
    metadata:
      labels:
        app: library-web
    spec:
      containers:
        - name: library-web
          image: library-devops-capstone-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5005
          envFrom:
            - configMapRef:
                name: library-config
            - secretRef:
                name: library-secret
          volumeMounts:
            - name: app-storage
              mountPath: /app/data
      volumes:
        - name: app-storage
          persistentVolumeClaim:
            claimName: library-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: library-service
spec:
  type: NodePort
  selector:
    app: library-web
  ports:
    - port: 80
      targetPort: 5005
      nodePort: 30005
