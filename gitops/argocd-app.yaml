apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: library-management-system
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Ankit-ai-05/library-devops-capstone.git
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
